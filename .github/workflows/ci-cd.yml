name: Iris MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: 🧪 Quality, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce PEP8 style standards
          flake8 src tests app.py --count --max-line-length=120 --statistics

      - name: 🧪 Run Pytest Suite
        run: |
          pytest -v tests/

      - name: 🎯 Model Training & Quality Gate Check
        run: |
          # Train model artifact & assert performance gate
          python -m src.train
          python -c "
          import json
          with open('models/metrics.json') as f:
              m = json.load(f)
          r2 = m['metrics']['test_r2']
          print(f'Test R2: {r2}')
          assert r2 >= 0.85, f'Quality Gate Failed: R2 {r2} is below 0.85 threshold!'
          print('✅ Model Quality Gate Passed successfully!')
          "

  docker-build-test:
    name: 🐳 Docker Container Build & Healthcheck
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: iris-linear-regression:ci-${{ github.sha }}

      - name: 🩺 Test Container Healthcheck
        run: |
          docker run -d --name iris-app -p 8501:8501 iris-linear-regression:ci-${{ github.sha }}
          sleep 5
          # Verify Streamlit health endpoint
          curl --fail http://localhost:8501/_stcore/health || exit 1
          echo "✅ Streamlit container is healthy and responding on port 8501!"
          docker stop iris-app
